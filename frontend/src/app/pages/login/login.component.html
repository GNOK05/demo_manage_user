<main class="login-page"><form class="login-card" [formGroup]="form" (ngSubmit)="submit()"><div class="brand">CompanyHub</div><h1>Đăng nhập</h1><p>Quản lý nhân sự và dự án trong một nơi.</p><label>Tên đăng nhập<input formControlName="username" autocomplete="username"></label><label>Mật khẩu<input type="password" formControlName="password" autocomplete="current-password"></label><p class="error" *ngIf="error">{{error}}</p><button [disabled]="form.invalid || loading">{{loading ? 'Đang đăng nhập…' : 'Đăng nhập'}}</button></form></main>
