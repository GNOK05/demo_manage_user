<main class="login-page">
  <div class="login-shell">
    <section class="login-hero">
      <div class="brand-wrap">
        <div class="brand-mark">CH</div>
        <div class="brand-text">CompanyHub</div>
      </div>
      <h1>Quản lý công ty hiệu quả hơn mỗi ngày.</h1>
      <p>Giám sát nhân sự, dự án, tiến độ làm việc và chấm công từ một nền tảng duy nhất.</p>
      <ul class="feature-list">
        <li>Dashboard theo dõi thực tế</li>
        <li>Quản lý nhân sự và phòng ban</li>
        <li>Phân công và theo dõi công việc</li>
      </ul>
    </section>

    <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
      <div class="login-title">Đăng nhập</div>
      <p class="login-subtitle">Chào mừng bạn quay trở lại.</p>

      <label>
        Tên đăng nhập
        <input
          formControlName="username"
          autocomplete="username"
          placeholder="Nhập tên đăng nhập"
        />
      </label>

      <label>
        Mật khẩu
        <input
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="Nhập mật khẩu"
        />
      </label>

      <p class="error" *ngIf="error">{{ error }}</p>

      <button class="login-button" [disabled]="form.invalid || loading">
        {{ loading ? 'Đang đăng nhập…' : 'Đăng nhập' }}
      </button>
    </form>
  </div>
</main>
