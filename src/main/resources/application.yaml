spring:
  datasource:
    # Default to in-memory H2 to avoid stale file locks during local restarts.
    # If you want file persistence, set DB_URL=jdbc:h2:file:./data/company_management;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
    url: ${DB_URL:jdbc:h2:mem:company_management;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    # Change this to a long random value in production (at least 32 characters).
    secret: company-management-local-development-secret-key-2026
    expiration-ms: 1800000
