spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/company_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:company_app}
    password: ${DB_PASSWORD:CompanyHub_Local_2026!}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  jackson:
    time-zone: Asia/Ho_Chi_Minh

app:
  time-zone: ${APP_TIME_ZONE:Asia/Ho_Chi_Minh}
  jwt:
    # Change this to a long random value in production (at least 32 characters).
    secret: company-management-local-development-secret-key-2026
    expiration-ms: 1800000
